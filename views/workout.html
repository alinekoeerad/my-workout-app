<div class="day-section active">
    <div class="workout-top-header">
        <div class="program-quick-badge" onclick="app.navigateTo('programs')" title="مشاهده و تغییر برنامه تمرینی">
            <span class="program-badge-dot"></span>
            <span class="program-badge-prefix">برنامه فعال:</span>
            <span id="workout-current-program-name" class="program-badge-text">...</span>
            <span class="program-badge-change">تغییر برنامه ↻</span>
        </div>
    </div>

    <div class="day-headline">
        <h1 id="workout-day-title">برنامه تمرینی</h1>
    </div>

    <!-- Overload Advisor Status Bar -->
    <div class="workout-advisor-bar">
        <div class="advisor-status-pill">
            <span class="advisor-indicator"></span>
            <span>سیستم اضافه بار پیشرونده: <strong style="color:var(--text-primary);">فعال 🟢</strong></span>
        </div>
        <div class="advisor-rule-tip">
            <span>🎯 راهنما: روی پیشنهادهای اضافه بار (+) کلیک کنید تا خودکار ثبت شوند.</span>
        </div>
    </div>

    <div id="workout-dynamic-content"></div>
</div>
